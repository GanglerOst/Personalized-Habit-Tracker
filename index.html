  <div id="app"></div>
  <noscript><p style="padding:30px">Enable JavaScript to use your habit tracker. Everything runs locally in your browser.</p></noscript>

    <form id="habit-form">
      <div class="field"><label for="habit-name">Habit name</label><input id="habit-name" placeholder="Read for 20 minutes" maxlength="60" required autocomplete="off"></div>
      <div class="field"><label for="habit-emoji">Your emoji or icon</label><input id="habit-emoji" maxlength="32" required autocomplete="off"><p class="small muted">Paste an emoji or choose one below. On Mac, press Control + Command + Space for more.</p></div>

      <div class="field"><label for="habit-category">Habit category</label><select id="habit-category"><option value="good">Good habit · something to do</option><option value="bad">Bad habit · something to avoid</option></select><p class="small muted" id="category-note"></p></div>
      <div class="modal-actions"><button type="button" class="btn secondary" id="editor-cancel">Cancel</button><button type="submit" class="btn">Save habit</button></div>
      <div class="archive hidden" id="archive-area"><button type="button" class="negative" id="archive-button">Archive this habit</button><div id="archive-confirm" class="hidden"><p class="small muted">Archive from tomorrow? Your previous check-ins and today’s goal stay intact.</p><button type="button" class="btn secondary" id="confirm-archive" style="margin-top:12px">Yes, archive from tomorrow</button></div></div>

  <script>const HabitDomain = (() => {
  const key = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
  const validDate = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && key(parse(s)) === s;
  const add = (s,n) => { const d=parse(s); d.setDate(d.getDate()+n); return key(d); };
  const month = s => { const d=parse(s); return Array.from({length:new Date(d.getFullYear(),d.getMonth()+1,0,12).getDate()},(_,i)=>key(new Date(d.getFullYear(),d.getMonth(),i+1,12))); };
  const week = s => { const first=Math.floor((parse(s).getDate()-1)/7)*7; return month(s).slice(first,first+7); };
  const due = (h,d) => d>=h.startDate && (!h.archivedFrom || d<h.archivedFrom);
  const daily = (habits,logs,d,today) => {
    const active=d>today?[]:habits.filter(h=>due(h,d));
    const successes=active.filter(h=>logs[d]?.[h.id]==='success').length;
    const logged=active.filter(h=>logs[d]?.[h.id]!==undefined).length;
    return {successes,possible:active.length,logged,percent:active.length?successes/active.length*100:null};
  };
  const range = (habits,logs,days,today) => {
    const stats=days.map(d=>daily(habits,logs,d,today));
    const successes=stats.reduce((s,d)=>s+d.successes,0),possible=stats.reduce((s,d)=>s+d.possible,0);
    return {successes,possible,percent:possible?successes/possible*100:null};
  };
  const streak = (h,logs,today) => {
    let d=today,n=0;
    if ((h.archivedFrom && d>=h.archivedFrom) || logs[d]?.[h.id]==='missed') return 0;
    if (logs[d]?.[h.id]!=='success') d=add(d,-1);
    while(due(h,d) && logs[d]?.[h.id]==='success'){ n++;d=add(d,-1); }
    return n;
  };
  const accents=['#6754D9','#007E73','#B34A20','#B53169'];
  const seed = (today=key()) => ({version:1,habits:[
    ['wake','Wake up at 9AM','⏰','good'],['gym','Gym','💪','good'],['protein','Protein shake','🥕','good'],
    ['porn','Porn','🛡️','bad'],['games','Games','🎮','bad'],['smoking','Smoking','🚭','bad'],['gambling','Gambling','🎲','bad'],
  ].map(([id,name,emoji,category])=>({id,name,emoji,category,startDate:today})),checkIns:{},preferences:{mode:'light',accent:accents[0]}});
  const record = x => x!==null && typeof x==='object' && !Array.isArray(x);
  function validate(data){
    if(!record(data)||data.version!==1||!Array.isArray(data.habits)||data.habits.length>500||!record(data.checkIns)||!record(data.preferences))throw Error('This is not a supported Lock In backup.');
    const p=data.preferences;
    if(!['light','dark'].includes(p.mode)||!accents.includes(p.accent))throw Error('Invalid theme settings.');
    const ids=new Set();
    for(const h of data.habits){
      if(!record(h)||typeof h.id!=='string'||!/^[\w-]{1,100}$/.test(h.id)||['__proto__','constructor','prototype'].includes(h.id)||ids.has(h.id)||
        typeof h.name!=='string'||!h.name.trim()||h.name.length>60||typeof h.emoji!=='string'||!h.emoji.trim()||h.emoji.length>32||

    }
    for(const [date,entries] of Object.entries(data.checkIns)){
      if(!validDate(date)||!record(entries))throw Error('Invalid date in check-in history.');
      for(const [id,outcome] of Object.entries(entries)){

      }
    }
    // Copy only supported fields and discard unknown keys in imported files.
    return {version:1,habits:data.habits.map(({id,name,emoji,category,startDate,archivedFrom})=>({id,name,emoji,category,startDate,...(archivedFrom?{archivedFrom}:{})})),
      checkIns:JSON.parse(JSON.stringify(data.checkIns)),preferences:{mode:p.mode,accent:p.accent}};
  }
  return {key,parse,validDate,add,month,week,due,daily,range,streak,accents,seed,validate};

  <script>(() => {

  catch(error){ readError='Saved data could not be opened. Your saved copy has been kept. You can retry or restore a valid backup.'; }

  }
  function weeklyChart(){

    return `<div class="intro"><div><h1>A little better, every day.</h1><p class="muted">Build good habits. Make space for a healthier you.</p></div><button class="btn" data-action="new">＋ Add habit</button></div>${summary()}
    <div class="workspace"><section><div class="section-head"><div><h2>${selected===today?'Your daily check-in':fmt(selected,{month:'long',day:'numeric'})}</h2><span class="small muted">${fmt(selected,{weekday:'long',month:'long',day:'numeric'})}</span></div><div class="row"><button class="icon-btn" data-action="week-prev" aria-label="Previous week">‹</button><button class="btn secondary small" data-action="today">Today</button><span style="flex:1"></span><button class="icon-btn" data-action="week-next" aria-label="Next week" ${days.at(-1)>=today?'disabled':''}>›</button></div></div><div class="weekrail">${weekrail}</div>
    ${['good','bad'].map(cat=>`<section class="habit-section"><h3 class="group-title"><span>${cat==='good'?'✦ GOOD HABITS':'◈ BAD HABITS'}</span><span class="pill">${due.filter(h=>h.category===cat).length}</span></h3><div class="habits">${due.filter(h=>h.category===cat).map(habitCard).join('')||'<div class="empty small">No active habits in this group.</div>'}</div></section>`).join('')}

  }
  function monthChart(){
    const days=D.month(selected).filter(d=>d<=today),points=days.map((d,i)=>({date:d,...D.range(state.habits,state.checkIns,days.slice(0,i+1),today)})).filter(d=>d.possible>0);

    if(points.length>1){const line=points.map((d,i)=>`${x(i)},${y(d.percent)}`).join(' ');s+=`<polygon points="${x(0)},${base} ${line} ${x(points.length-1)},${base}" fill="var(--accent)" opacity=".07"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;}

  function matrix(){

    }).join('')}</tr>`).join('')}<tr><th scope="row">Daily completion</th>${days.map(d=>`<td>${pct(D.daily(state.habits,state.checkIns,d,today).percent)}</td>`).join('')}</tr></tbody></table></div>`;

>Your habits</h2><p class="chart-note">Edit a habit from Daily. You can personalize its name and emoji. Archive it to preserve your past progress.</p><button class="btn secondary" style="margin-top:16px" data-action="new">＋ Add a habit</button><p class="chart-note">${state.habits.length} habits in your history · no account required</p></section></div></div>`;
  }
  function blockedView(){
    el('app').innerHTML=`<main class="blocked card"><div class="brand"><span class="brand-mark">✓</span>Lock In</div><h1 style="margin-top:24px">Let’s protect your progress.</h1><p class="muted" style="margin-top:16px">${esc(readError)}</p><div class="backup-actions"><button class="btn" data-action="retry-load">Retry loading</button><button class="btn secondary" data-action="import">Restore backup</button></div><p class="chart-note">No saved data has been overwritten.</p></main>`;

="negative" data-action="export">Back up your progress</button></span></footer></main></div>`;

  function openEditor(id){

  document.addEventListener('click',event=>{

    if(editing){editing.name=name;editing.emoji=emoji;}
    else{
      state.habits.push({id:`habit-${Date.now()}-${Math.random().toString(36).slice(2,9)}`,name,emoji,category:el('habit-category').value,startDate:today});
      selected=today;
    }
    save();el('editor').close();render();toast(editing?'Habit updated.':'A fresh start. Your new habit begins today.');
  });
  el('editor-close').addEventListener('click',()=>el('editor').close());
  el('editor-cancel').addEventListener('click',()=>el('editor').close());
  document.querySelectorAll('[data-emoji]').forEach(b=>b.addEventListener('click',()=>{el('habit-emoji').value=b.dataset.emoji;}));
  el('archive-button').addEventListener('click',()=>{el('archive-confirm').classList.remove('hidden');el('archive-button').classList.add('hidden');});
  el('confirm-archive').addEventListener('click',()=>{
    if(!editing)return;editing.archivedFrom=D.add(today,1);save();el('editor').close();render();toast('Archived from tomorrow. Your history stays intact.');
  });
  el('import-file').addEventListener('change',async event=>{
    const file=event.target.files[0];if(!file)return;
    if(file.size>10*1024*1024){toast('Please choose a backup smaller than 10 MB.');return;}
    try{
      importCandidate=D.validate(JSON.parse(await file.text()));
      el('import-description').textContent=`This backup has ${importCandidate.habits.length} habits and ${Object.keys(importCandidate.checkIns).length} days of check-ins. It will replace the data currently saved in this browser. Export your current backup first if you want to keep it.`;
      el('restore').showModal();
    }catch(error){toast(error.message||'This backup could not be read.');}
  });
  el('restore-cancel').addEventListener('click',()=>{el('restore').close();importCandidate=null;});
  el('restore-confirm').addEventListener('click',()=>{
    if(!importCandidate)return;
    state=importCandidate;importCandidate=null;readError='';selected=today;save();el('restore').close();render();toast('Your backup is restored. Welcome back.');
  });
  function refreshDate(){const next=D.key();if(next!==today){if(selected===today||selected>next)selected=next;today=next;render();}}
  setInterval(refreshDate,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDate();});
  window.addEventListener('storage',event=>{
    if(event.key!==STORAGE)return;
    try{
      if(event.newValue){state=D.validate(JSON.parse(event.newValue));readError='';saveError='';persisted=true;render();toast('Updated from your other tab.');}
      else toast('Saved data was removed in another tab. Export a backup to keep this copy.');
    }catch{toast('Could not load a change from another tab. Your current view is kept.');}
  });
  render();
  if(!readError&&!persisted){save();render();}
})();
</script>
</body>
</html>
